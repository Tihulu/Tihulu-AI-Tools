[package]
name = "tihulu-ai-market"
version = "0.1.0"
description = "Offline-first, deterministic model compatibility and market contracts"
edition = "2021"
rust-version = "1.82"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tihulu-ai-registry = { path = "../tihulu-ai-registry", default-features = false }

[lib]
name = "tihulu_ai_market"
path = "src/lib.rs"

# Workspace membership is owned by the coordinator (PR #19).
# Do not add a nested [workspace] or change the root Cargo.toml.
