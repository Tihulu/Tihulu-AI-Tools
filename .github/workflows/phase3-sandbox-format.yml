name: Phase 3 Sandbox — Apply rustfmt (isolated branch only)

# One-shot formatter on the coordinator-owned sandbox branch.
# 2026-11-12: format new independent-app path planner and preserve scoped test coverage.
# Never checks out, writes to or merges main or another agent branch.
on:
  push:
    branches: [coord/phase2-integration-sandbox]
    paths: [".github/workflows/phase3-sandbox-format.yml"]

permissions:
  contents: write

jobs:
  rustfmt-sandbox:
    if: github.repository == 'Tihulu/Tihulu-AI-Tools' && github.ref == 'refs/heads/coord/phase2-integration-sandbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact sandbox head
        uses: actions/checkout@v4
        with:
          ref: coord/phase2-integration-sandbox
          persist-credentials: true
      - name: Rust format toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format combined workspace and standalone Tauri desktop
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --manifest-path apps/tihulu-ai-desktop/src-tauri/Cargo.toml --all
      - name: Validate diff
        run: git diff --check
      - name: Commit Rust formatting only to sandbox
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No rustfmt changes required."
            exit 0
          fi
          git diff --stat
          if git diff --name-only | grep -Ev '^(crates/|apps/tihulu-ai-cli/|apps/tihulu-ai-desktop/src-tauri/).*\.rs$'; then
            echo "::error::Formatting modified a non-Rust source path."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/ apps/tihulu-ai-cli/ apps/tihulu-ai-desktop/src-tauri/
          git commit -m "style(sandbox): rustfmt workspace and standalone Tauri shell"
          git push origin HEAD:refs/heads/coord/phase2-integration-sandbox
      - name: Verify formatting
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/tihulu-ai-desktop/src-tauri/Cargo.toml --all --check
