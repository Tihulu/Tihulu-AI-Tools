name: Phase 5 Independent QA - Mock Boundaries

# QA-owned; no installations, providers, GPU workloads, or real model writes.
on:
  push:
    branches: [agent/08-phase5-independent-qa]
    paths: ["qa/phase5/**", ".github/workflows/phase5-independent-qa.yml"]
  pull_request:
    paths: ["qa/phase5/**", ".github/workflows/phase5-independent-qa.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-contracts:
    name: Portable public APIs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: QA Rust format
        run: cargo fmt --manifest-path qa/phase5/Cargo.toml --all -- --check
      - name: QA independent Rust tests
        run: cargo test --manifest-path qa/phase5/Cargo.toml --all-targets
      - name: QA Rust lint
        run: cargo clippy --manifest-path qa/phase5/Cargo.toml --all-targets -- -D warnings
      - name: Combined portable Rust modules (mock only)
        run: cargo test --workspace --all-targets
      - name: QA UI/native negative tests
        run: node --test qa/phase5/js/native-safety.test.mjs
      - name: Existing UI mock regressions
        run: npm --prefix apps/tihulu-ai-web test

  native-tauri:
    name: Native Tauri compile (no launch)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: Desktop native format
        run: cargo fmt --manifest-path apps/tihulu-ai-desktop/src-tauri/Cargo.toml --all -- --check
      - name: Desktop native compile and tests
        run: cargo test --manifest-path apps/tihulu-ai-desktop/src-tauri/Cargo.toml --all-targets
      - name: Desktop native Clippy
        run: cargo clippy --manifest-path apps/tihulu-ai-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

# Success only proves source/mock checks on named CI runners.
# Hardware, app installs, Jan/Ollama, mTLS pairing and real cleanup are not tested.
