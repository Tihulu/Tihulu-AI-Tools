name: Rust Core — Multi-OS

on:
  push:
    branches: [main, feat/rust-foundation, coord/phase2-integration-sandbox, coord/phase4-native-inventory]
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "apps/tihulu-ai-cli/**"
      - "apps/tihulu-ai-web/**"
      - "apps/tihulu-ai-desktop/**"
      - "scripts/**"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/**"
      - "apps/tihulu-ai-cli/**"
      - ".github/workflows/rust-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: windows-x86_64
            os: windows-2025
          - target: windows-aarch64
            os: windows-11-arm
          - target: macos-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Sandbox only: run test and lint even when source formatting fails.
      # Aggregate all three outcomes and keep the job red until all are green.
      - name: Rust format
        id: formatting
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Rust tests
        id: testing
        continue-on-error: true
        run: cargo test --workspace --all-targets
      - name: Rust lint
        id: linting
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Aggregate Rust results
        if: always()
        shell: bash
        run: |
          echo "Format: ${{ steps.formatting.outcome }}"
          echo "Tests: ${{ steps.testing.outcome }}"
          echo "Clippy: ${{ steps.linting.outcome }}"
          if [[ "${{ steps.formatting.outcome }}" != success ]] ||
             [[ "${{ steps.testing.outcome }}" != success ]] ||
             [[ "${{ steps.linting.outcome }}" != success ]]; then
            echo "::error::Rust format, test or lint did not pass."
            exit 1
          fi

  platform-synthetic:
    name: Platform — Python lifecycle mock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python script syntax
        run: python3 -m compileall -q scripts
      - name: Python platform and owned-resource regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Owned dummy-child shutdown smoke
        run: python3 scripts/platform_lifecycle_smoke.py --owned-child-smoke
      - name: Validate integrated member layout
        run: python3 scripts/validate_standalone_crates.py --integrated

  ui-web-synthetic:
    name: UI — typed mock state and i18n
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JS syntax
        run: npm --prefix apps/tihulu-ai-web run check
      - name: UI state and shutdown mock tests
        run: npm --prefix apps/tihulu-ai-web test

  # Deliberately NOT claiming hardware acceptance:
  # - Raspberry Pi 5 GPIO/PCIe, Hailo-10H, CUDA RTX 5080 and packaging require
  #   actual hardware and target-specific installation tests.
  # - Debian native desktop and Tauri bundles are future workstreams.
